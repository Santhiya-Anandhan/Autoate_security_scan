
name: Security Scan

on: [push, pull_request]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools
        run: pip install bandit pip-audit

      - name: SAST Scan
        run: bandit -r . -ll

      - name: SCA Scan
        run: pip-audit -r requirements.txt
